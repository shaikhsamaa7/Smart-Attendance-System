name: CI Pipeline

on:
  push:
    branches:
      - main
      - SCRUM-11-develop-attendance-dashboard
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check HTML file
        run: test -f index.html

      - name: Check CSS file
        run: test -f style.css

      - name: Check JavaScript file
        run: test -f script.js

      - name: Validate project
        run: |
          echo "Smart Attendance project files verified successfully."
          echo "CI pipeline completed successfully."